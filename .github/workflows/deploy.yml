name: Test and deploy Fulgencio agent

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fulgencio-agent-production
  cancel-in-progress: false

env:
  TF_WORKING_DIR: terraform
  AZURE_RESOURCE_GROUP: fulgencio-rg
  AZURE_LOCATION: West Europe
  ACR_NAME: fulgencioacr
  CONTAINER_APP_ENVIRONMENT: fulgencio-env
  CONTAINER_APP_NAME: fulgencio-agent
  TFSTATE_RESOURCE_GROUP: fulgencio-tfstate-rg
  TFSTATE_CONTAINER: tfstate
  TFSTATE_KEY: fulgencio-agent.terraform.tfstate

  TF_VAR_resource_group_name: fulgencio-rg
  TF_VAR_acr_name: fulgencioacr
  TF_VAR_environment_name: fulgencio-env
  TF_VAR_identity_name: fulgencio-identity
  TF_VAR_container_app_name: fulgencio-agent
  TF_VAR_image_name: fulgencio-agent:${{ github.sha }}
  TF_VAR_azure_openai_endpoint: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
  TF_VAR_azure_openai_api_key: ${{ secrets.AZURE_OPENAI_API_KEY }}
  TF_VAR_azure_openai_api_version: ${{ secrets.AZURE_OPENAI_API_VERSION }}
  TF_VAR_litellm_master_key: ${{ secrets.LITELLM_MASTER_KEY }}
  TF_VAR_firebase_database_url: ${{ secrets.FIREBASE_DATABASE_URL }}
  TF_VAR_firebase_service_account_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
  TF_VAR_azure_sql_connection_string: ${{ secrets.AZURE_SQL_CONNECTION_STRING }}
  TF_VAR_ws_basic_username: ${{ secrets.FULGENCIO_WS_BASIC_USERNAME }}
  TF_VAR_ws_basic_password: ${{ secrets.FULGENCIO_WS_BASIC_PASSWORD }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Validate Azure credentials secret
        shell: bash
        env:
          AZURE_CREDENTIALS_JSON: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          if [ -z "${AZURE_CREDENTIALS_JSON:-}" ]; then
            echo "Falta el GitHub Secret AZURE_CREDENTIALS en este repositorio."
            exit 1
          fi
          if ! jq -e '(.clientId and .clientSecret and .subscriptionId and .tenantId)' \
            <<< "$AZURE_CREDENTIALS_JSON" >/dev/null; then
            echo "AZURE_CREDENTIALS debe contener clientId, clientSecret, subscriptionId y tenantId."
            exit 1
          fi

      - name: Terraform format and validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configure shared Terraform state
        shell: bash
        env:
          AZURE_CREDENTIALS_JSON: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          subscription_id=$(jq -r '.subscriptionId' <<< "$AZURE_CREDENTIALS_JSON")
          if [ -z "$subscription_id" ] || [ "$subscription_id" = "null" ]; then
            echo "AZURE_CREDENTIALS no contiene subscriptionId válido."
            exit 1
          fi
          echo "ARM_SUBSCRIPTION_ID=$subscription_id" >> "$GITHUB_ENV"
          compact_subscription=$(tr -d '-' <<< "$subscription_id")
          state_account="fulgenciotf${compact_subscription:0:10}"
          echo "TFSTATE_STORAGE_ACCOUNT=$state_account" >> "$GITHUB_ENV"

      - name: Validate deployment configuration
        shell: bash
        run: |
          required=(
            TF_VAR_azure_openai_endpoint
            TF_VAR_azure_openai_api_key
            TF_VAR_azure_openai_api_version
            TF_VAR_litellm_master_key
            TF_VAR_firebase_database_url
            TF_VAR_firebase_service_account_json
            TF_VAR_azure_sql_connection_string
            TF_VAR_ws_basic_username
            TF_VAR_ws_basic_password
          )
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "Falta $name"
              exit 1
            fi
          done

      - name: Read shared Terraform state key
        shell: bash
        run: |
          state_access_key=$(az storage account keys list \
            --resource-group "$TFSTATE_RESOURCE_GROUP" \
            --account-name "$TFSTATE_STORAGE_ACCOUNT" \
            --query '[0].value' --output tsv)
          echo "::add-mask::$state_access_key"
          echo "ARM_ACCESS_KEY=$state_access_key" >> "$GITHUB_ENV"

      - name: Terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init -reconfigure \
            -backend-config="resource_group_name=$TFSTATE_RESOURCE_GROUP" \
            -backend-config="storage_account_name=$TFSTATE_STORAGE_ACCOUNT" \
            -backend-config="container_name=$TFSTATE_CONTAINER" \
            -backend-config="key=$TFSTATE_KEY"

      - name: Verify shared Azure resources
        run: |
          az group show --name "$AZURE_RESOURCE_GROUP" --output none
          az acr show --name "$ACR_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --output none
          az containerapp env show \
            --name "$CONTAINER_APP_ENVIRONMENT" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --output none

      - name: Build and push agent image
        run: |
          acr_username=$(az acr credential show \
            --name "$ACR_NAME" \
            --query username --output tsv)
          acr_password=$(az acr credential show \
            --name "$ACR_NAME" \
            --query 'passwords[0].value' --output tsv)
          echo "::add-mask::$acr_password"
          docker login "$ACR_NAME.azurecr.io" \
            --username "$acr_username" \
            --password "$acr_password"
          docker build \
            --tag "$ACR_NAME.azurecr.io/$TF_VAR_image_name" \
            .
          docker push "$ACR_NAME.azurecr.io/$TF_VAR_image_name"
          docker logout "$ACR_NAME.azurecr.io"

      - name: Deploy agent Container App
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -auto-approve

      - name: Check readiness
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: bash
        run: |
          fqdn=$(terraform output -raw fqdn)
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "https://${fqdn}/health/ready"; then
              echo
              echo "Agent ready at wss://${fqdn}/ws"
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Publish deployment URL
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: bash
        run: |
          {
            echo "## Fulgencio agent"
            echo
            echo "**WebSocket:** wss://$(terraform output -raw fqdn)/ws"
          } >> "$GITHUB_STEP_SUMMARY"
